;-----------------------------------------------------------------------------
; Kira Alerts Redis Listener - Supervisor Configuration
;-----------------------------------------------------------------------------
;
; This configuration runs the alerts:listen command as a long-running process
; that subscribes to ML pipeline Redis channels and dispatches alert jobs.
;
; Installation:
;   1. Copy this file to /etc/supervisor/conf.d/alerts-listener.conf
;   2. Update the paths and user as needed for your environment
;   3. Run: sudo supervisorctl reread && sudo supervisorctl update
;   4. Start: sudo supervisorctl start alerts-listener:*
;
; Monitoring:
;   sudo supervisorctl status alerts-listener
;   tail -f /var/www/app/storage/logs/alerts-listener.log
;   php artisan alerts:health-check
;
;-----------------------------------------------------------------------------

[program:alerts-listener]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/app/artisan alerts:listen
directory=/var/www/app
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/var/www/app/storage/logs/alerts-listener.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
stopwaitsecs=30
stopsignal=SIGTERM
